[project]
name = "ha-aoe2"
version = "0.5.1"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.14.5",
    "probatio>=0.13.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "homeassistant>=2026.10.4",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component>=0.13.373",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "PIE", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["custom_components", "scripts", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
reportIncompatibleVariableOverride = false
allowedUntypedLibraries = ["homeassistant", "pytest_homeassistant_custom_component"]
reportAny = false
reportExplicitAny = false
