[project]
name = "ha-aoe2"
version = "0.5.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.14.5",
    "probatio>=0.13.0",
]

[dependency-groups]
dev = [
    "homeassistant>=2026.10.4",
    "pyright[nodejs]>=1.1.414",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component>=0.13.373",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "PIE"]

[tool.pyright]
include = ["custom_components", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportIncompatibleVariableOverride = false
