[project]
name = "ha-aoe2"
version = "0.2.0"
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component>=0.13.373",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["custom_components", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportIncompatibleVariableOverride = false
