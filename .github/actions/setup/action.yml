name: Set up project
description: Install uv and Python, then sync the locked dev dependencies.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.4"
        python-version: "3.14"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --group dev
