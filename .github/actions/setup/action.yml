name: Set up project
description: Install uv and Python, then sync the locked dev dependencies.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.4"
        python-version: "3.14"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --group dev
