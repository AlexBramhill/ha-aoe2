name: Set up project
description: Install uv and Python, then sync the locked dev dependencies.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.4"
        python-version: "3.14"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --group dev
