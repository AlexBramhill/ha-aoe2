name: Set up project
description: Install uv and Python, then sync the locked dev dependencies.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.4"
        python-version: "3.14"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --group dev
